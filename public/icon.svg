<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="600" fill="#F8FAFC"/>

  <!-- Dashboard Container -->
  <rect x="100" y="80" width="600" height="440" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Sidebar -->
  <rect x="100" y="80" width="120" height="440" rx="16" fill="#1E293B" />
  <!-- Fix sidebar right corners to be square so it blends seamlessly with the main content area -->
  <rect x="200" y="80" width="20" height="440" fill="#1E293B" />

  <!-- Sidebar Items -->
  <rect x="120" y="120" width="80" height="12" rx="6" fill="#334155"/>
  <rect x="120" y="160" width="60" height="12" rx="6" fill="#3B82F6"/> <!-- Active Menu Item -->
  <rect x="120" y="200" width="70" height="12" rx="6" fill="#334155"/>
  <rect x="120" y="240" width="50" height="12" rx="6" fill="#334155"/>
  <rect x="120" y="280" width="75" height="12" rx="6" fill="#334155"/>

  <!-- Header -->
  <rect x="250" y="110" width="200" height="32" rx="16" fill="#F1F5F9"/> <!-- Search Bar -->
  <circle cx="660" cy="126" r="16" fill="#E2E8F0"/> <!-- User Avatar -->

  <!-- Page Title & Subtitle -->
  <rect x="250" y="180" width="140" height="24" rx="4" fill="#0F172A"/>
  <rect x="250" y="215" width="200" height="10" rx="4" fill="#94A3B8"/>

  <!-- Table Header -->
  <rect x="250" y="260" width="430" height="30" rx="6" fill="#F8FAFC"/>

  <!-- Table Row 1 -->
  <circle cx="270" cy="320" r="12" fill="#DBEAFE"/>
  <rect x="295" y="315" width="80" height="10" rx="4" fill="#334155"/>
  <rect x="420" y="315" width="100" height="10" rx="4" fill="#94A3B8"/>
  <rect x="580" y="312" width="60" height="16" rx="8" fill="#D1FAE5"/> <!-- Status: Converted (Green) -->

  <!-- Table Row 2 -->
  <rect x="250" y="345" width="430" height="1" fill="#F1F5F9"/>
  <circle cx="270" cy="370" r="12" fill="#FEE2E2"/>
  <rect x="295" y="365" width="70" height="10" rx="4" fill="#334155"/>
  <rect x="420" y="365" width="90" height="10" rx="4" fill="#94A3B8"/>
  <rect x="580" y="362" width="60" height="16" rx="8" fill="#FEF3C7"/> <!-- Status: Contacted (Yellow) -->

  <!-- Table Row 3 -->
  <rect x="250" y="395" width="430" height="1" fill="#F1F5F9"/>
  <circle cx="270" cy="420" r="12" fill="#E0E7FF"/>
  <rect x="295" y="415" width="90" height="10" rx="4" fill="#334155"/>
  <rect x="420" y="415" width="80" height="10" rx="4" fill="#94A3B8"/>
  <rect x="580" y="412" width="60" height="16" rx="8" fill="#DBEAFE"/> <!-- Status: New (Blue) -->

  <!-- Table Row 4 -->
  <rect x="250" y="445" width="430" height="1" fill="#F1F5F9"/>
  <circle cx="270" cy="470" r="12" fill="#F3E8FF"/>
  <rect x="295" y="465" width="60" height="10" rx="4" fill="#334155"/>
  <rect x="420" y="465" width="110" height="10" rx="4" fill="#94A3B8"/>
  <rect x="580" y="462" width="60" height="16" rx="8" fill="#F3E8FF"/> <!-- Status: Follow-up (Purple) -->

  <!-- Definitions for shadows and effects -->
  <defs>
    <filter id="shadow" x="0" y="0" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>
</svg>
